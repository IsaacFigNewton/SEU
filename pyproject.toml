[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seu"
version = "0.1.0"
description = "SEU (Entity Alignment) - Frustratingly Simple but Effective Unsupervised Entity Alignment without Neural Networks"
authors = [
    {name = "SEU Development Team"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["entity-alignment", "knowledge-graph", "unsupervised", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.6.0",
    "tensorflow>=2.4.1",
    "numba>=0.53.0",
    "tqdm>=4.60.0",
    "requests>=2.25.0",
]
